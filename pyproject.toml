[project]
name = "brasaland-api"
version = "0.1.0"
description = "Brasaland Digital API: incidents analyzer and supplier directory"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic[email]>=2.7",
    "tinydb>=4.8",
]

[project.scripts]
seed = "services.api.seed:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services", "shared"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
